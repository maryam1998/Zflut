<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LingoLearn — language learning app">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#1B4640">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LingoLearn">
  <link rel="manifest" href="manifest.json">
  <title>LingoLearn</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #EFE6C9;
      font-family: sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      justify-content: center;
      background: #EFE6C9;
      z-index: 9999;
    }
    #loading pre {
      display: none;
      max-width: 90%;
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      color: #9E3B3B;
      font-size: 12px;
      direction: ltr;
    }
    #loading .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #C99A2E;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading"><div class="spinner"></div><pre id="boot-error"></pre></div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // اگر برنامه بالا نیامد، به‌جای صفحه‌ی خالی، دلیلش را روی صفحه نشان بده.
    function showBootError(msg) {
      var pre = document.getElementById('boot-error');
      if (!pre) return;
      pre.style.display = 'block';
      pre.textContent += msg + '\n';
    }
    window.addEventListener('error', function (e) {
      showBootError('JS error: ' + (e.message || e) + (e.filename ? ' @ ' + e.filename : ''));
    });
    window.addEventListener('unhandledrejection', function (e) {
      showBootError('Promise error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
    });
    setTimeout(function () {
      if (document.getElementById('loading')) {
        showBootError('App did not start after 20s. Check network access to www.gstatic.com / fonts.gstatic.com (VPN/filter?) and the browser console.');
      }
    }, 20000);
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
</body>
</html>
