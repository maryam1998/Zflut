<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LingoLearn — language learning app">

  <!-- base href برای GitHub Pages — نام ریپو باید این‌جا باشه -->
  <base href="/Zflut/">

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#1B4640">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LingoLearn">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>LingoLearn</title>

  <!--
    برای فونت‌های فارسی/لاتین، اگر خواستی از Google Fonts استفاده کنی
    (نسخه‌ی وب اصلی همین کار رو می‌کرد). اگر فونت‌ها رو لوکال داری،
    این تگ‌ها رو حذف کن و از @font-face استفاده کن.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background-color: #EFE6C9;
      font-family: 'Vazirmatn', sans-serif;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #EFE6C9;
      z-index: 9999;
    }
    #loading .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #C99A2E;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading"><div class="spinner"></div></div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // حذف اسپینر بعد از بالا آمدن اپ
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) el.remove();
    });
  </script>
</body>
</html>
