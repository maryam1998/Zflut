name: linlearn
description: LinLearn Flutter port
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  
  # === Overlay & System ===
  flutter_overlay_window: ^0.4.4    # حباب شناور روی بقیه اپ‌ها
  system_alert_window: ^1.0.0        # جایگزین پیشرفته
  flutter_foreground_task: ^8.0.0    # سرویس پس‌زمینه
  permission_handler: ^11.3.0
  device_info_plus: ^10.1.0

  # === TTS / STT ===
  flutter_tts: ^4.0.2                # TTS سیستمی
  speech_to_text: ^7.0.0             # STT سیستمی
  whisper_ggml: ^1.4.0               # Whisper local
  record: ^5.0.4                     # ضبط صدا
  
  # === Translation ===
  google_mlkit_translation: ^0.12.0  # ML Kit on-device
  google_mlkit_language_id: ^0.11.0
  
  # === YouTube & Media ===
  youtube_explode_dart: ^2.2.1
  youtube_player_flutter: ^9.0.0
  video_player: ^2.8.6
  just_audio: ^0.9.38
  
  # === Storage ===
  shared_preferences: ^2.2.3
  hive_flutter: ^1.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.3
  sqflite: ^2.3.3

  # === HTTP & Utils ===
  dio: ^5.5.0
  http: ^1.2.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  equatable: ^2.0.5

  # === UI ===
  fl_chart: ^0.68.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10
  lottie: ^3.1.0
  
  # === Platform ===
  device_apps: ^2.2.0               # لیست اپ‌ها برای overlay

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/           # Whisper, Sherpa models
    - assets/data/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/fonts/Vazirmatn-Regular.ttf
        - asset: assets/fonts/Vazirmatn-Bold.ttf
