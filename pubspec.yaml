name: zflut
description: LingoLearn - Hope + LinLearn in Flutter
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ═══ State / Routing ═══
  flutter_riverpod: ^2.4.0
  go_router: ^14.0.0

  # ═══ Backend / Storage / Network ═══
  supabase_flutter: ^2.5.0
  shared_preferences: ^2.2.3
  dio: ^5.4.0
  # کشِ دائمیِ ترجمه‌ها: وب = IndexedDB، موبایل = فایل (معادلِ translationCacheDb.js در Hope)
  sembast: ^3.7.0
  sembast_web: ^2.4.0
  path_provider: ^2.1.0
  intl: '>=0.19.0 <0.21.0'

  # ═══ Audio (TTS + پخش) ═══
  just_audio: ^0.9.36
  flutter_tts: ^4.0.2

  # ═══ داستان‌ساز: انتخابِ فایل، PDF، OCR (اندروید/iOS) ═══
  file_picker: ^8.1.2
  pdfx: ^2.9.0
  syncfusion_flutter_pdf: ^33.2.13
  google_mlkit_text_recognition: ^0.13.1

  # ═══ ضبطِ صدای کاربر (shadowing) ═══
  record: ^5.1.2

  cupertino_icons: ^1.0.6

# record_linux 0.7.x با record_platform_interface 1.6 سازگار نیست و بیلد اندروید را می‌شکند
dependency_overrides:
  record_linux: '>=1.3.0 <2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
