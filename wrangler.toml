name = "phrasebook-api"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Non-secret config (visible in the dashboard, fine to keep here).
# ⚠️ نکته‌ی مهم: هر بار `wrangler deploy` اجرا بشه (چه دستی، چه از طریقِ
# ورک‌فلوی گیت‌هاب‌اکشنز)، همینجا (نه هرچی دستی توی داشبوردِ Cloudflare
# گذاشته باشی) منبعِ حقیقت می‌شه — یعنی اگه بعداً بخوای ترتیب/لیستِ
# پرووایدرها رو عوض کنی، باید همینجا (نه فقط توی داشبورد) عوضش کنی، وگرنه
# دفعه‌ی بعد که پوش کنی، دوباره برمی‌گرده به همین مقدار.
#
# ترتیب زیر: اول سه‌تایی که اصلاً کلید نمی‌خوان (kilocode، llm7،
# ovhcloud) — این‌ها همیشه یه شانسِ رایگان و بی‌نیاز از تنظیمات می‌دن.
# بعدش پرووایدرهایی با سقفِ رایگانِ سخاوتمندتر، و آخرِ صف هرکدوم که یا
# کلید ندارن یا طبقِ تجربه مشکل‌دار بودن (gemini/huggingface). هر
# پرووایدری که کلیدش (پایین‌تر، به‌صورتِ secret) ست نشده باشه، خودکار رد
# می‌شه و زنجیره می‌ره سراغِ بعدی — پس عیبی نداره اگه فعلاً کلیدِ همه‌شون
# رو نداری.
[vars]
AI_PROVIDER = "groq,gemini,cerebras,mistral,nvidianim,cloudflareai,ollamacloud,ovhcloud,llm7,openrouter,siliconflow,zai,cohere,aionlabs,modelscope,grok,avalai,deepseek,openai,huggingface,kilocode"
GEMINI_MODEL = "gemini-3.6-flash"
HF_MODEL = "openai/gpt-oss-120b"

# 🔐 احراز هویت: "on" = فقط اپِ لاگین‌شده؛ "log" = فقط لاگ (برای مرحله‌ی انتقال)؛ "off" = قدیمی
# Secrets لازم:  wrangler secret put SESSION_SECRET / SUPABASE_URL / SUPABASE_ANON_KEY
AUTH_MODE = "on"
LIMIT_AI = "600"      # ترجمه/زیرنویس/تشخیص گفتار — در روزِ هر کاربر
LIMIT_TTS = "4000"    # صدای آنلاین
LIMIT_MISC = "3000"
MAX_PROMPT_CHARS = "30000"  # حداکثر طولِ prompt در /api/generate (هزینه‌ی توکنِ ورودی)
LIMIT_TRANSLATE = "4000"   # ترجمه‌ی لمسی (/api/translate-text) — شاملِ کش‌ها؛ هزینه‌ی AI با DAILY_TRANSLATE کنترل می‌شود

# 💎 نسخه‌ی رایگان: سقفِ «کل عمر» برای هر بخش (مثال‌ساز، گرامر، چت، ویدیوکال، داستان، ترجمه‌ی زنده، ذره‌بین، ترجمه‌ی یوتیوب)
FREE_LIMIT = "2"
# 🔭 ترجمه‌ی زنده و ذره‌بین: فقط ۲ بارِ «کل عمر» برای تست؛ بعدش Pro (مستقل از FREE_LIMIT)
FREE_LIMIT_LIVE = "2"
FREE_LIMIT_MAGNIFIER = "2"
# 🧩 مثال‌سازِ مشترک: حداکثر چند مثال برای هر لغت در D1 ذخیره شود (بعدش دیگر AI صدا زده نمی‌شود)
EXAMPLE_POOL_MAX = "8"
# 📞 تماس صوتی/تصویری رایگان: FREE_LIMIT_VIDEOCALL جلسه در «کل عمر» (نه روزانه)، هر جلسه حداکثر FREE_CALL_SECONDS ثانیه (سمتِ سرور).
#    بعد از تمام‌شدنِ جلسه یا سقف، اتصالِ دوباره ۴۰۲ می‌گیرد — حتی بعد از ۳۰ دقیقه یا فردا.
FREE_LIMIT_VIDEOCALL = "1"
FREE_CALL_SECONDS = "180"

# 📅 سقفِ روزانه‌ی هر بخش (سمتِ سرور/D1) — فقط برای کاربرانِ «رایگان». عدد = تعداد «استفاده» در روز؛ حذف یا ۰ = بدونِ سقف.
# Pro/VIP سقفِ روزانه‌ی هر بخش ندارند؛ فقط سقفِ کلی (LIMIT_AI=600 / LIMIT_TTS=4000 / LIMIT_MISC=3000) رویشان اعمال می‌شود.
# اگر خواستی این سقف‌ها برای Pro/VIP هم باشد:  DAILY_APPLY_TO_PRO = "1"
# (چت/تماس/یوتیوب هر نشستِ ۳۰/۳۰/۶۰ دقیقه‌ای یک استفاده حساب می‌شود). پیش‌فرض‌ها را بعد از دیدنِ آمارِ واقعی تنظیم کن.
# --- Free tier daily limits ---
DAILY_EXAMPLE = "60"
DAILY_GRAMMAR = "30"
DAILY_STORY = "5"
DAILY_CHAT = "20"
DAILY_VIDEOCALL = "10"
DAILY_YTSUB = "10"
# 🌐 ترجمه و درخواست‌های بدونِ بخش — برای همه‌ی کاربران (حتی Pro/VIP)، و فقط «کش‌نشده‌ها» (واقعاً AI) حساب می‌شوند؛
#    ترجمه‌ی کش‌شده (حافظه‌ی گوشی/کشِ مشترکِ D1) هیچ سهمیه‌ای مصرف نمی‌کند. ۰ = بدونِ سقف.
DAILY_TRANSLATE = "150"
# سقفِ اختصاصیِ یک بخش (اختیاری):  FREE_LIMIT_STORY = "3"
# 📊 گزارشِ مصرفِ AI (اختیاری) — پنل: https://<worker>/admin/usage-report?key=<ADMIN_KEY>
#   ADMIN_KEY را secret بگذار:  npx wrangler secret put ADMIN_KEY
#   تعرفه (دلار برای هر ۱M توکن [ورودی, خروجی]) و آستانه‌ی هشدار؛ بدونِ تعرفه هزینه ۰ ثبت می‌شود:
# AI_PRICING = '{"gemini":[0.30,2.50],"deepseek":[0.28,0.42],"default":[0,0]}'
# AI_ALERT_COST_USD = "0.50"
# AI_ALERT_CALLS = "400"

# 👑 جیمیل‌هایی که همیشه Pro (بدونِ محدودیت) هستند؛ با ویرگول جدا کن. (نقطه و +‌ی جیمیل نادیده گرفته می‌شود)
VIP_EMAILS = "maryam.s.sharifiyan@gmail.com"

# ⭐ NEW: Cloudflare Workers AI binding — برای تبدیلِ صدا به متن با Whisper
# (@cf/openai/whisper-large-v3-turbo). رایگان: ۱۰٬۰۰۰ نورون در روز.
[ai]
binding = "AI"

# API keys are NOT set here — set them as secrets instead (see README.md
# and DEPLOY.md), so they never end up in git or the dashboard's
# plain-text vars. Set each one you actually have with:
#   npx wrangler secret put GROQ_API_KEY
#   npx wrangler secret put MISTRAL_API_KEY
#   npx wrangler secret put OPENROUTER_API_KEY
#   npx wrangler secret put GEMINI_API_KEY
#   npx wrangler secret put HF_API_KEY
#   npx wrangler secret put CEREBRAS_API_KEY
#   npx wrangler secret put GROK_API_KEY
#   npx wrangler secret put AIONLABS_API_KEY
#   npx wrangler secret put COHERE_API_KEY
#   npx wrangler secret put ZAI_API_KEY
#   npx wrangler secret put CF_API_TOKEN
#   npx wrangler secret put CF_ACCOUNT_ID
#   npx wrangler secret put MODELSCOPE_API_KEY
#   npx wrangler secret put NVIDIA_API_KEY
#   npx wrangler secret put OLLAMA_API_KEY
#   npx wrangler secret put SILICONFLOW_API_KEY
# (kilocode/llm7/ovhcloud need no key at all — skip those three.)
# Secrets set this way persist across deploys; `wrangler deploy` never
# touches or clears them.

# ⭐ D1 — کشِ مشترکِ ترجمه (binding باید دقیقاً TR_DB باشد)
[[d1_databases]]
binding = "TR_DB"
database_name = "phrasebook-tr-cache"
database_id = "2c917ede-0b23-492a-9833-9b35400c56c3"
