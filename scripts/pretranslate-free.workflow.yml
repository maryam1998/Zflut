# 📁 این فایل را در GitHub (وب) با این مسیر بساز و محتوایش را پیست کن:
#    .github/workflows/pretranslate-free.yml
# (فایل‌های داخلِ .github از طریقِ zip پچ اعمال نمی‌شوند.)
#
# لازم است در GitHub → Settings → Secrets and variables → Actions یک secret بسازی:
#    GEMINI_API_KEY   (کلیدِ Gemini؛ همان کلیدی که در Cloudflare برای Worker گذاشته‌ای هم جواب می‌دهد)
# و دو secretِ قبلی (CLOUDFLARE_API_TOKEN و CLOUDFLARE_ACCOUNT_ID) که برای seed-paid-content داری.
# اختیاری (Variables): PRETR_MODEL = نامِ یک مدلِ قوی‌تر؛ پیش‌فرض همان GEMINI_MODEL فایل wrangler.toml است.
#
# اجرا: Actions → «Pre-translate free content (D1)» → Run workflow
# (بعد از هر تغییرِ محتوای رایگان یا تغییرِ TR_MODEL_VERSION دوباره اجرا کن.)
name: Pre-translate free content (D1)

on:
  workflow_dispatch:

concurrency:
  group: pretranslate-free
  cancel-in-progress: false

jobs:
  pretranslate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Translate free content with a strong model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PRETR_MODEL: ${{ vars.PRETR_MODEL }}
        run: node scripts/pretranslate-free.mjs

      - name: Seed translations into D1 cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm i -g wrangler@3
          for f in tr_seed/*.sql; do
            echo "== $f"
            wrangler d1 execute phrasebook-tr-cache --remote --file="$f" || exit 1
          done
