name: Deploy Web to GitHub Pages

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.x'
          cache: true

      - name: Generate web folder if missing
        run: |
          if [ ! -d web ]; then
            flutter create --platforms=web --project-name lingolearn --org app.lingolearn /tmp/scaffold
            cp -r /tmp/scaffold/web .
            sed -i 's|<title>.*</title>|<title>LingoLearn</title>|' web/index.html
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: |
          sed -i '/synthetic-package/d' l10n.yaml
          sed -i 's/^flutter:$/flutter:\n  generate: true/' pubspec.yaml
          flutter pub get
          flutter gen-l10n

      - name: Check Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY are not set as repository secrets. The app will show a config-error screen."
          fi

      - name: Build web
        run: >
          flutter build web --release --base-href "/Zflut/"
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
