name: Convert JS data to JSON

on:
  push:
    paths:
      - 'hope-data/*.js'
      - 'scripts/convert-data.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Convert data
        run: node scripts/convert-data.mjs

      - name: Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/
          git diff --cached --quiet || git commit -m "chore: convert JS data to JSON [skip ci]"
          git push || true
