name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.x'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate localizations
        run: |
          sed -i '/synthetic-package/d' l10n.yaml
          sed -i 's/^flutter:$/flutter:\n  generate: true/' pubspec.yaml
          flutter pub get
          flutter gen-l10n

      - name: Download Sherpa-ONNX AAR
        run: |
          mkdir -p android/app/libs
          rm -f android/app/libs/*.aar
          curl -L --retry 3 --retry-delay 5 \
            -o android/app/libs/sherpa-onnx-1.13.4.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-1.13.4.aar"
          ls -lh android/app/libs/

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" \
            | tr -d '\r\n' \
            | sed 's/-----[A-Z ]*-----//g' \
            | base64 -d > android/app/release-key.jks
          ls -lh android/app/release-key.jks

      # â”€â”€â”€â”€â”€ Ù†Ø³Ø®Ù‡â€ŒÛŒ ÙØ±ÙˆØ´Ú¯Ø§Ù‡ÛŒ (Ú¯ÙˆÚ¯Ù„â€ŒÙ¾Ù„ÛŒ / Ú©Ø§ÙÙ‡â€ŒØ¨Ø§Ø²Ø§Ø± / Ù…Ø§ÛŒÚ©Øª) â”€â”€â”€â”€â”€
      - name: Build STORE APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: >
          flutter build apk --release --flavor store
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          2>&1 | tee build-store-apk.log

      - name: Build STORE AAB (Google Play)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: >
          flutter build appbundle --release --flavor store
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          2>&1 | tee build-store-aab.log

      # â”€â”€â”€â”€â”€ Ù†Ø³Ø®Ù‡â€ŒÛŒ Ú©Ø§Ù…Ù„ (Ù‡Ù…Ù‡â€ŒÛŒ Ù‚Ø§Ø¨Ù„ÛŒØªâ€ŒÙ‡Ø§) â”€â”€â”€â”€â”€
      - name: Build FULL APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: >
          flutter build apk --release --flavor full
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          2>&1 | tee build-full-apk.log

      - name: Show errors only
        if: failure()
        run: |
          grep -nE "error:|e: |What went wrong|FAILED|Execution failed|cannot find symbol|Could not" -A3 build-*.log | head -120

      - uses: actions/upload-artifact@v4
        with:
          name: STORE-apk-for-bazaar-myket
          path: build/app/outputs/flutter-apk/app-store-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: STORE-aab-for-google-play
          path: build/app/outputs/bundle/storeRelease/app-store-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: FULL-apk-all-features
          path: build/app/outputs/flutter-apk/app-full-release.apk
