name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash   # یعنی bash -eo pipefail؛ تا خطای flutter build زیر | tee گم نشود
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.35.x'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Generate localizations
        run: |
          sed -i '/synthetic-package/d' l10n.yaml
          sed -i 's/^flutter:$/flutter:\n  generate: true/' pubspec.yaml
          flutter pub get
          flutter gen-l10n

      - name: Download Sherpa-ONNX AAR
        run: |
          mkdir -p android/app/libs
          rm -f android/app/libs/*.aar
          curl -L --retry 3 --retry-delay 5 \
            -o android/app/libs/sherpa-onnx-1.13.4.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.4/sherpa-onnx-1.13.4.aar"
          ls -lh android/app/libs/

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" \
          | tr -d '\r\n' \
          | sed 's/-----[A-Z ]*-----//g' \
          | base64 -d > android/app/release-key.jks
          ls -lh android/app/release-key.jks

      - name: Build STORE APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: > 
          flutter build apk --release --flavor store --target-platform android-arm64 
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} 
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} 
          2>&1 | tee build-store-apk.log

      - name: Build STORE AAB (Google Play)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: > 
          flutter build appbundle --release --flavor store --target-platform android-arm64 
          --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} 
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} 
          2>&1 | tee build-store-aab.log

      - name: Verify 64-bit only (arm64-v8a)
        run: |
          set -e
          for f in build/app/outputs/flutter-apk/app-store-release.apk \
                   build/app/outputs/bundle/storeRelease/app-store-release.aab; do
            [ -f "$f" ] || continue
            echo "=== $f ($(du -h "$f" | cut -f1))"
            if unzip -l "$f" | grep -E "(^|/)lib/(armeabi-v7a|x86|x86_64)/"; then
              echo "::error::non-arm64 native libs found in $f"; exit 1
            fi
            echo "--- biggest entries"
            unzip -l "$f" | sort -rn | head -12 || true
          done

      - name: Show errors only
        if: failure()
        run: |
          echo "=== خطاهای Dart (فایل:خط) ==="
          grep -hE "\.dart:[0-9]+:[0-9]+: *(Error|error)|^Error:|Target kernel_snapshot|Target aot_|Dart compiler|Unresolved|cannot find symbol|e: file" -A3 build-*.log | head -80 || true
          echo "=== خطاهای Gradle ==="
          grep -hE "What went wrong|Execution failed|Could not|FAILED" -A3 build-*.log | head -60 || true

      - uses: actions/upload-artifact@v4
        with:
          name: STORE-apk-for-bazaar-myket
          path: build/app/outputs/flutter-apk/app-store-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: STORE-aab-for-google-play
          path: build/app/outputs/bundle/storeRelease/app-store-release.aab
