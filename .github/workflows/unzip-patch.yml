name: Apply patch zip

# هر فایل *.zip که در ریشه‌ی ریپو push شود: باز می‌شود، فایل‌ها در مسیر خودشان
# جایگزین می‌شوند، zip حذف می‌شود، commit می‌شود و دیپلوی راه می‌افتد.
on:
  push:
    branches: [ main ]
    paths:
      - '*.zip'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip patch, copy files, delete zip
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(./*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip in repo root — nothing to do."
            exit 0
          fi

          for z in "${zips[@]}"; do
            echo "== Applying $z"
            tmp="$(mktemp -d)"
            unzip -q -o "$z" -d "$tmp"
            rm -rf "$tmp/__MACOSX"
            find "$tmp" -name '.DS_Store' -delete

            # اگر zip یک پوشه‌ی ریشه‌ی واحد دارد (مثل Zflut-main/)، یک سطح بالا بیا.
            src="$tmp"
            entries=("$tmp"/* "$tmp"/.[!.]*)
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ] \
               && { [ -d "${entries[0]}/lib" ] || [ -f "${entries[0]}/pubspec.yaml" ]; }; then
              src="${entries[0]}"
            fi

            # workflow فایل‌ها را GITHUB_TOKEN اجازه‌ی push ندارد → نادیده بگیر.
            rm -rf "$src/.github"

            # فهرست حذف (اختیاری): هر خط یک مسیر نسبت به ریشه‌ی ریپو.
            if [ -f "$src/_delete.txt" ]; then
              while IFS= read -r p || [ -n "$p" ]; do
                p="${p%$'\r'}"
                [ -z "$p" ] && continue
                case "$p" in
                  /*|*..*|.git/*|.github/*) echo "skip unsafe path: $p"; continue ;;
                esac
                echo "delete: $p"
                rm -rf -- "./$p"
              done < "$src/_delete.txt"
              rm -f "$src/_delete.txt"
            fi

            # کپی با حفظ ساختار پوشه‌ها (جایگزین فایل‌های هم‌نام)
            cp -a "$src"/. ./
            rm -rf "$tmp"
            git rm -q --cached -- "$z" 2>/dev/null || true
            rm -f -- "$z"
          done

      - name: Commit and push
        id: push
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes to commit."
          else
            git commit -m "chore: apply patch zip"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # push با GITHUB_TOKEN workflow دیگری را trigger نمی‌کند؛ پس دیپلوی را دستی صدا می‌زنیم.
      - name: Trigger deploy
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-web.yml --ref main
